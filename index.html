      function answerMatches(answer, word) {
        const expected = state.currentMode === 'reverse' ? word.word : word.translation;
        const normal = (value) => normalize(value)
          .replace(/[.!?]+$/g, '')
          .replace(/\s+/g, ' ')
          .trim();
        const submitted = normal(answer);
        const exact = String(expected).split(';').map(normal);
        if (exact.includes(submitted)) return true;
        const entry = zunoTranslationVariants[String(word.word).toLowerCase()];
        if (!entry) return false;
        const variants = state.currentMode === 'reverse' ? (entry.foreign || []) : (entry.de || []);
        return variants.some((variant) => normal(variant) === submitted);
      }

      function renderQuestion() {
        const word = state.session[state.index];
        if (!word) return finishSession();
        state.answered = false;
        document.getElementById('questionCounter').textContent = (state.index + 1) + ' / ' + state.session.length;
        document.getElementById('lessonProgress').style.width = (state.index / state.session.length * 100) + '%';
        document.getElementById('feedbackArea').innerHTML = '';
        document.getElementById('nextButton').classList.add('hidden');
        const mode = getModes()[state.index % 3]; state.currentMode = mode;
        const target = document.getElementById('targetWord');
        const example = document.getElementById('exampleSentence');
        const mascot = document.getElementById('exerciseMascot'); mascot.src = 'IMG_2558.png';
        if (mode === 'reverse') {
          const language = word.language === 'fr' ? 'Französisch' : 'Englisch';
          document.getElementById('modeLabel').textContent = 'Wie heißt das auf ' + language + '?';
          target.textContent = word.translation; example.classList.add('hidden'); example.textContent = ''; mascot.src = 'IMG_2560.png';
        } else {
          document.getElementById('modeLabel').textContent = mode === 'choice' ? 'Wähle die richtige Übersetzung' : 'Übersetze das Wort';
          target.textContent = word.word;
          const sentence = getExample(word.word);
          if (sentence) { example.innerHTML = highlightWord(sentence, word.word); example.classList.remove('hidden'); }
          else { example.textContent = ''; example.classList.add('hidden'); }
          if (mode === 'choice') mascot.src = 'IMG_2560.png';
        }
        renderAnswerArea(word);
      }

      function speakCurrentWord() {
        if (!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined') {
          document.getElementById('feedbackArea').innerHTML = '<div class="feedback bad" role="status">Die Sprachausgabe wird von diesem Browser nicht unterstützt.</div>'; return;
        }
        const word = state.session[state.index]; if (!word) return;
        const reverse = state.currentMode === 'reverse';
        const text = reverse ? word.translation : word.word;
        const lang = reverse ? 'de-DE' : (word.language === 'fr' ? 'fr-FR' : 'en-AU');
        try {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text); utterance.lang = lang; utterance.rate = 0.88; utterance.pitch = 1;
          const prefix = lang.slice(0, 2).toLowerCase();
          const voices = window.speechSynthesis.getVoices().filter((voice) => voice.lang && voice.lang.toLowerCase().startsWith(prefix));
          let voice = voices[0];
          if (prefix === 'en') voice = voices.find((item) => /australia|en-au/i.test(item.lang + ' ' + item.name)) || voice;
          else voice = voices.find((item) => item.lang.toLowerCase() === lang.toLowerCase()) || voice;
          if (voice) utterance.voice = voice;
          window.speechSynthesis.speak(utterance);
        } catch (error) { console.warn('Speech synthesis unavailable', error); }
      }

      const response = await fetch(source, {cache:"no-store"});

      page = page.replace("</body>", "<script>\n" + patch + "\n<\\/script></body>");
      document.open(); document.write(page); document.close();
    } catch (error) {
      document.getElementById("status").outerHTML = '<p class="error" role="alert">ZUNO konnte nicht geladen werden. Bitte prüfe deine Internetverbindung und lade die Seite erneut. Deine gespeicherten Fortschritte bleiben erhalten.</p>';
      console.error(error);
