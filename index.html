
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7d69e8">
  <title>ZUNO</title>

  <style>
    :root {
      font-family: Inter, "Segoe UI", sans-serif;
      color: #20212a;
      background: #f7f7fa;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
    }

    .logo {
      color: #6351c7;
      font-weight: 900;
      font-size: 26px;
      letter-spacing: -.08em;
    }

    .muted {
      color: #6d7283;
      line-height: 1.55;
    }

    .error {
      background: #ffeceb;
      color: #9d3b33;
      padding: 14px;
      border-radius: 12px;
      line-height: 1.5;
    }

    .track {
      height: 5px;
      border-radius: 9px;
      background: #eceaf5;
      overflow: hidden;
      margin: 20px 0 12px;
    }

    .track span {
      display: block;
      width: 40%;
      height: 100%;
      background: #7d69e8;
      border-radius: inherit;
      animation: load 1s ease-in-out infinite alternate;
    }

    @keyframes load {
      to { transform: translateX(150%); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main id="loader" aria-live="polite" style="
    width:min(440px,calc(100% - 32px));
    margin:15vh auto;
    background:white;
    border:1px solid #ecebf2;
    border-radius:22px;
    padding:26px;
    box-shadow:0 18px 42px #20212a12;
  ">
    <div class="logo">ZUNO.</div>
    <p id="status">Lerninhalte werden geladen …</p>
    <div class="track" aria-hidden="true"><span></span></div>
    <p class="muted">
      Deine Vokabeln, Beispiele, Fortschritte und Maskottchen bleiben erhalten.
    </p>
  </main>

  <script>
  (async function loadZuno() {
    const oldLoader =
      "https://raw.githubusercontent.com/KiU10/ZUNO/e91adbeb9ffd118ca3eeccee2fc6db094dbb6bad/index.html";

    const source =
      "https://raw.githubusercontent.com/KiU10/ZUNO/3ade70981b096db00dd74d30e5eaf067d50263bc/index.html";

    const moduleBase = "./";
    const version = "?v=9";

    const status = document.getElementById("status");

    async function fetchText(url) {
      const response = await fetch(url, { cache: "no-store" });

      if (!response.ok) {
        throw new Error("GitHub antwortet mit HTTP " + response.status);
      }

      return response.text();
    }

    try {
      status.textContent = "Lade deine bisherigen Lerninhalte ...";

      const previousLoader = await fetchText(oldLoader);

      /* VOKABEL-PATCH SICHER AUSLESEN */
      const startMarker = "const patch = String.raw";
      const patchStart = previousLoader.indexOf(startMarker);

      if (patchStart === -1) {
        throw new Error("Der bisherige Vokabel-Patch wurde nicht gefunden.");
      }

      const contentStart = patchStart + startMarker.length;
      const openingBacktick = previousLoader.indexOf("`", contentStart);

      if (openingBacktick === -1) {
        throw new Error("Der Anfang des Vokabel-Patches fehlt.");
      }

      const tryMarker = "\n    try {";
      const tryPosition = previousLoader.indexOf(tryMarker, openingBacktick);

      if (tryPosition === -1) {
        throw new Error("Das Ende des alten Loaders wurde nicht gefunden.");
      }

      const closingBacktick = previousLoader.lastIndexOf("`;", tryPosition);

      if (closingBacktick === -1 || closingBacktick <= openingBacktick) {
        throw new Error("Der Vokabel-Patch konnte nicht vollständig gelesen werden.");
      }

      let patch = previousLoader.slice(
        openingBacktick + 1,
        closingBacktick
      );

      patch = patch.replace(/<\/script/gi, "<\\/script");

      status.textContent = "Verbinde mit der ZUNO-App ...";

      let page = await fetchText(source);

      if (!page.includes("</body>") || !page.includes("</head>")) {
        throw new Error("Die geladene ZUNO-Datei ist unvollständig.");
      }

      /* AUTOMATISCHES BEENDEN DER LETZTEN FRAGE */
      const answerPattern =
        /      if \(isCorrect\) \{[\s\S]*?\n      \}\n    \}\n\n    function recordSchoolAnswer/;

      const fixedAnswerFlow = `      const isLastQuestion =
        state.index === state.session.length - 1;

      if (isLastQuestion) {
        document.getElementById('nextButton').classList.add('hidden');

        window.setTimeout(() => {
          if (
            state.answered &&
            !state.sessionFinished &&
            state.index === state.session.length - 1
          ) {
            finishSession();
          }
        }, 1500);

      } else if (isCorrect) {
        document.getElementById('nextButton').classList.add('hidden');

        window.setTimeout(() => {
          if (state.answered && state.index < state.session.length - 1) {
            nextQuestion();
          }
        }, 1500);

      } else {
        document.getElementById('nextButton').classList.remove('hidden');
        document.getElementById('nextButton').focus();
      }
    }

    function recordSchoolAnswer`;

      if (!answerPattern.test(page)) {
        throw new Error("Der Antwortablauf wurde in der Original-App nicht gefunden.");
      }

      page = page.replace(answerPattern, fixedAnswerFlow);

      /* XP-BUTTON ANKLICKBAR MACHEN */
      const oldXPButton =
        '<span class="pill">⚡ <span id="headerXP">0</span> XP</span>';

      const newXPButton =
        '<button class="pill zuno-xp-trigger" type="button" ' +
        'onclick="showXPPage()" aria-label="XP-Übersicht öffnen">' +
        '⚡ <span id="headerXP">0</span> XP</button>';

      if (!page.includes(oldXPButton)) {
        throw new Error("Der XP-Button in der Original-App wurde nicht gefunden.");
      }

      page = page.replace(oldXPButton, newXPButton);

      /* XP- UND ARCADE-SEITE */
      const newPages = `
        <section id="xpPage" class="hidden zuno-xp-page">
          <button class="secondary-btn" type="button" onclick="showDashboard()">
            ← Zurück
          </button>

          <div class="zuno-xp-hero">
            <div class="zuno-xp-copy">
              <span class="zuno-eyebrow">DEIN FORTSCHRITT</span>
              <h1>Deine XP.</h1>
              <p>
                Lerne neue Wörter, sammle Erfahrung und schalte
                neue Möglichkeiten frei.
              </p>
            </div>

            <img
              class="zuno-xp-mascot"
              src="IMG_2563.png"
              alt="ZUNO Maskottchen"
              onerror="this.style.display='none'"
            >
          </div>

          <div class="zuno-xp-balance">
            <span class="zuno-xp-symbol">⚡</span>
            <div>
              <span class="zuno-xp-label">Dein aktueller Kontostand</span>
              <strong><span id="zunoXPBalance">0</span> XP</strong>
            </div>
          </div>

          <div class="zuno-xp-info-grid">
            <article class="zuno-xp-info-card">
              <span class="zuno-info-icon">📚</span>
              <h3>XP verdienen</h3>
              <p>
                Beantworte Vokabelfragen richtig und sammle
                <strong>10 XP</strong> pro richtiger Antwort.
              </p>
            </article>

            <article class="zuno-xp-info-card">
              <span class="zuno-info-icon">🎮</span>
              <h3>XP ausgeben</h3>
              <p>
                Eine neue Spielrunde kostet
                <strong>50 XP</strong>. Spiele selbst geben keine XP zurück.
              </p>
            </article>
          </div>

          <div class="zuno-xp-streak">
            <span>🔥</span>
            <div>
              <strong><span id="zunoXPStreak">0</span>-Tage-Streak</strong>
              <p>Bleib täglich dran, um weitere Spiele freizuschalten.</p>
            </div>
          </div>

          <button
            class="zuno-arcade-cta"
            type="button"
            onclick="showArcadePage()"
          >
            <span class="zuno-arcade-cta-icon">🎮</span>
            <span>
              <strong>Zur ZUNO Arcade</strong>
              <small>Entdecke alle verfügbaren Spiele</small>
            </span>
            <span class="zuno-cta-arrow">→</span>
          </button>
        </section>

        <section id="arcadePage" class="hidden zuno-arcade-page">
          <button class="secondary-btn" type="button" onclick="showXPPage()">
            ← Zurück zu deinen XP
          </button>

          <div id="zunoArcade">
            <div class="zuno-arcade-heading">
              <div>
                <span class="zuno-eyebrow">ZEIT FÜR EINE RUNDE?</span>
                <h1>🎮 ZUNO Arcade</h1>
                <p class="zuno-arcade-subtitle">
                  Gib deine verdienten XP für Spielrunden aus.
                </p>
              </div>

              <span class="pill zuno-arcade-xp">
                ⚡ <span id="zunoArcadeXP">0</span> XP
              </span>
            </div>

            <div class="zuno-game-grid" id="zunoGameGrid"></div>
          </div>
        </section>
      `;

      if (!page.includes("</main>")) {
        throw new Error("Der Hauptbereich der App wurde nicht gefunden.");
      }

      page = page.replace("</main>", newPages + "</main>");

      /* NEUE SEITEN IN showOnly AUFNEHMEN */
      const oldPageList =
        "['dashboard', 'settings', 'unitSettings', 'exercise', 'result', 'statsPage']";

      const newPageList =
        "['dashboard', 'settings', 'unitSettings', 'exercise', 'result', 'statsPage', 'xpPage', 'arcadePage']";

      if (!page.includes(oldPageList)) {
        throw new Error("Die Seitennavigation der App wurde nicht gefunden.");
      }

      page = page.replace(oldPageList, newPageList);

      /* CSS-DATEIEN LADEN */
      const styles =
        '<link rel="stylesheet" href="' + moduleBase + "games.css" + version + '">' +
        '<link rel="stylesheet" href="' + moduleBase + "animations.css" + version + '">';

      page = page.replace("</head>", styles + "</head>");

      /* SCRIPTS LADEN */
      const speechFixScript = `
        <script>
        (function() {
          window.speakCurrentWord = function() {
            if (
              !('speechSynthesis' in window) ||
              typeof SpeechSynthesisUtterance === 'undefined'
            ) {
              const feedback = document.getElementById('feedbackArea');
              if (feedback) {
                feedback.innerHTML =
                  '<div class="feedback bad" role="status">' +
                  'Die Sprachausgabe wird von diesem Browser nicht unterstützt.' +
                  '</div>';
              }
              return;
            }

            const word = state.session[state.index];
            if (!word) return;

            const isReverse = state.currentMode === 'reverse';
            const text = isReverse ? word.translation : word.word;

            const languageCode = isReverse
              ? 'de-DE'
              : word.language === 'fr'
                ? 'fr-FR'
                : 'en-AU';

            try {
              window.speechSynthesis.cancel();

              const utterance = new SpeechSynthesisUtterance(text);
              utterance.lang = languageCode;
              utterance.rate = 0.88;
              utterance.pitch = 1;

              const voices = window.speechSynthesis.getVoices();
              const prefix = languageCode.slice(0, 2).toLowerCase();

              const matching = voices.filter(voice =>
                voice.lang && voice.lang.toLowerCase().startsWith(prefix)
              );

              const preferred =
                matching.find(voice =>
                  voice.lang.toLowerCase() === languageCode.toLowerCase()
                ) || matching[0];

              if (preferred) utterance.voice = preferred;
              window.speechSynthesis.speak(utterance);

            } catch (error) {
              console.error('ZUNO speech error:', error);
            }
          };
        })();
        <\/script>
      `;

      const scripts =
        "<script>\n" + patch + "\n<\/script>" +
        speechFixScript +
        '<script src="' + moduleBase + "zuno-ai.js" + version + '"><\/script>' +
        '<script src="' + moduleBase + "zuno-examples.js" + version + '"><\/script>' +
        '<script src="' + moduleBase + "progress.js" + version + '"><\/script>' +
        '<script src="' + moduleBase + "games.js" + version + '"><\/script>';

      page = page.replace("</body>", scripts + "</body>");

      status.textContent = "ZUNO geladen. Starte App ...";
      document.open();
      document.write(page);
      document.close();

    } catch (error) {
      status.className = "error";
      status.textContent = "Fehler beim Laden: " + error.message;
      console.error("ZUNO loading error:", error);
    }
  })();
  </script>
</body>
</html>
