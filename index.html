<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7d69e8">
  <title>ZUNO</title>

  <style>
    :root {
      font-family: Inter, "Segoe UI", sans-serif;
      color: #20212a;
      background: #f7f7fa;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
    }

    .logo {
      color: #6351c7;
      font-weight: 900;
      font-size: 26px;
      letter-spacing: -.08em;
    }

    .muted {
      color: #6d7283;
      line-height: 1.55;
    }

    .error {
      background: #ffeceb;
      color: #9d3b33;
      padding: 14px;
      border-radius: 12px;
      line-height: 1.5;
    }

    .track {
      height: 5px;
      border-radius: 9px;
      background: #eceaf5;
      overflow: hidden;
      margin: 20px 0 12px;
    }

    .track span {
      display: block;
      width: 40%;
      height: 100%;
      background: #7d69e8;
      border-radius: inherit;
      animation: load 1s ease-in-out infinite alternate;
    }

    @keyframes load {
      to { transform: translateX(150%); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

  (async function loadZuno() {
    const oldLoader =
      "https://raw.githubusercontent.com/KiU10/ZUNO/e91adbeb9ffd118ca3eeccee2fc6db094dbb6bad/index.html";

    const source =
      "https://raw.githubusercontent.com/KiU10/ZUNO/3ade70981b096db00dd74d30e5eaf067d50263bc/index.html";

    const moduleBase = "./";
    const version = "?v=11";
    const status = document.getElementById("status");

    async function fetchText(url) {
      const response = await fetch(url, { cache: "no-store" });

      if (!response.ok) {
        throw new Error("GitHub antwortet mit HTTP " + response.status);
      }

      return response.text();
    }

    try {
      status.textContent = "Lade deine bisherigen Lerninhalte ...";

      const previousLoader = await fetchText(oldLoader);
      const startMarker = "const patch = String.raw";
      const patchStart = previousLoader.indexOf(startMarker);

      if (patchStart === -1) {
        throw new Error("Der bisherige Vokabel-Patch wurde nicht gefunden.");
      }

      const contentStart = patchStart + startMarker.length;
      const openingBacktick = previousLoader.indexOf("", contentStart);
      const tryMarker = "\n    try {";
      const tryPosition = previousLoader.indexOf(tryMarker, openingBacktick);
      const closingBacktick = previousLoader.lastIndexOf(";", tryPosition);

      if (
        openingBacktick === -1 ||
        tryPosition === -1 ||
        closingBacktick <= openingBacktick
      ) {
        throw new Error("Der Vokabel-Patch konnte nicht vollständig gelesen werden.");
      }

      let patch = previousLoader.slice(
        openingBacktick + 1,
        closingBacktick
      );

      patch = patch.replace(/<\/script/gi, "<\\/script");

      status.textContent = "Verbinde mit der ZUNO-App ...";

      let page = await fetchText(source);

      if (!page.includes("</body>") || !page.includes("</head>")) {
        throw new Error("Die geladene ZUNO-Datei ist unvollständig.");
      }

      /* AUTOMATISCHES BEENDEN DER LETZTEN FRAGE */
      const answerPattern =
        /      updateDashboard\(\);\n\n      if \(isCorrect\) \{[\s\S]*?\n      \}\n    \}\n\n    function recordSchoolAnswer/;

      const fixedAnswerFlow = `      updateDashboard();

      const isLastQuestion =
        state.index === state.session.length - 1;

      if (isLastQuestion) {
        document.getElementById('nextButton').classList.add('hidden');

        window.setTimeout(() => {
          if (
            state.answered &&
            !state.sessionFinished &&
            state.index === state.session.length - 1
          ) {
            finishSession();
          }
        }, 1500);

      } else if (isCorrect) {
        document.getElementById('nextButton').classList.add('hidden');

        window.setTimeout(() => {
          if (state.answered && state.index < state.session.length - 1) {
            nextQuestion();
          }
        }, 1500);

      } else {
        document.getElementById('nextButton').classList.remove('hidden');
        document.getElementById('nextButton').focus();
      }
    }

    function recordSchoolAnswer`;

      if (!answerPattern.test(page)) {

      page = page.replace(answerPattern, fixedAnswerFlow);

      const speechFixScript = `
        <script>
        (function() {
          window.speakCurrentWord = function() {
            if (
              !('speechSynthesis' in window) ||
              typeof SpeechSynthesisUtterance === 'undefined'
            ) {
              const feedback = document.getElementById('feedbackArea');
              if (feedback) {
                feedback.innerHTML =
                  '<div class="feedback bad" role="status">' +
                  'Die Sprachausgabe wird von diesem Browser nicht unterstützt.' +
                  '</div>';
              }
              return;
            }

            const word = state.session[state.index];
            if (!word) return;

            const isReverse = state.currentMode === 'reverse';
            const text = isReverse ? word.translation : word.word;

            const languageCode = isReverse
              ? 'de-DE'
              : word.language === 'fr'
                ? 'fr-FR'
                : 'en-AU';

            try {
              window.speechSynthesis.cancel();

              const utterance = new SpeechSynthesisUtterance(text);
              utterance.lang = languageCode;
              utterance.rate = 0.88;
              utterance.pitch = 1;

              const voices = window.speechSynthesis.getVoices();
              const prefix = languageCode.slice(0, 2).toLowerCase();

              const matching = voices.filter(voice =>
                voice.lang && voice.lang.toLowerCase().startsWith(prefix)
              );

              const preferred =
                matching.find(voice =>
                  voice.lang.toLowerCase() === languageCode.toLowerCase()
                ) || matching[0];

              if (preferred) utterance.voice = preferred;
              window.speechSynthesis.speak(utterance);

            } catch (error) {
              console.error('ZUNO speech error:', error);
            }
          };
        })();
        <\/script>
      `;

            },
            {
              id: "royal",
              name: "Royal Spark",
              description: "Ein besonderer violetter Style.",
              icon: "💎",
              price: 1200
            },
            {
              id: "galaxy",
              name: "GALAXY LEGEND",
              description: "Das seltenste Cosmetic im ZUNO-Shop.",
              icon: "🌌",
              price: 2500,
              legendary: true
            }
          ];

          function getCosmeticData() {
            try {
              const data = JSON.parse(localStorage.getItem(COSMETICS_KEY) || "{}");
              return {
                owned: Array.isArray(data.owned) ? data.owned : [],
                equipped: data.equipped || null
              };
            } catch (_) {
              return { owned: [], equipped: null };
            }
          }

          function saveCosmeticData(data) {
            localStorage.setItem(COSMETICS_KEY, JSON.stringify(data));
          }

          function refreshXPDisplays() {
            const xp = Number(state.xp) || 0;

            [
              "zunoXPBalance",
              "zunoArcadeXP",
              "zunoShopXP"
            ].forEach(id => {
              const element = document.getElementById(id);
              if (element) element.textContent = xp;
            });

            const streak = Number(state.streak) || 0;
            const streakElement = document.getElementById("zunoXPStreak");

            if (streakElement) streakElement.textContent = streak;
          }

          function renderCosmetics() {
            const grid = document.getElementById("zunoCosmeticGrid");
            if (!grid) return;

            const data = getCosmeticData();

            grid.innerHTML = cosmetics.map(item => {
              const owned = data.owned.includes(item.id);
              const equipped = data.equipped === item.id;

              let buttonText = "⚡ " + item.price.toLocaleString("de-DE") + " XP";
              let disabled = false;

              if (equipped) {
                buttonText = "✓ Ausgerüstet";
                disabled = true;
              } else if (owned) {
                buttonText = "Ausrüsten";
              } else if (state.xp < item.price) {
                buttonText = "Zu wenig XP";
                disabled = true;
              } else {
                buttonText = "Kaufen · " + item.price.toLocaleString("de-DE") + " XP";
              }

              return \
                <article class="zuno-cosmetic \${owned ? "owned" : ""} \${item.legendary ? "legendary" : ""}">
                  <div class="zuno-cosmetic-visual">\${item.icon}</div>
                  <h3>\${item.name}</h3>
                  <p>\${item.description}</p>
                  <button
                    type="button"
                    data-cosmetic-id="\${item.id}"
                    \${disabled ? "disabled" : ""}
                  >\${buttonText}</button>
                </article>
              \;
            }).join("");

            grid.querySelectorAll("[data-cosmetic-id]").forEach(button => {
              button.addEventListener("click", () => {
                buyOrEquipCosmetic(button.dataset.cosmeticId);
              });
            });

            refreshXPDisplays();
          }

          function buyOrEquipCosmetic(id) {
            const item = cosmetics.find(cosmetic => cosmetic.id === id);
            if (!item) return;

            const data = getCosmeticData();

            if (data.owned.includes(id)) {
              data.equipped = id;
              saveCosmeticData(data);
              renderCosmetics();
              return;
            }

            if (state.xp < item.price) {
              alert("Du hast noch nicht genug XP für dieses Cosmetic.");
              return;
            }

            if (!confirm(item.name + " für " + item.price + " XP kaufen?")) {
              return;
            }

            state.xp -= item.price;
            data.owned.push(id);
            data.equipped = id;

            saveState();
            saveCosmeticData(data);

            if (typeof updateDashboard === "function") {
              updateDashboard();
            }

            renderCosmetics();
          }

          function updateStreakStatus() {
            const status = document.getElementById("zunoStreakTestStatus");
            if (!status) return;

            status.textContent = "Aktueller Streak: " + state.streak + " Tage";
          }

          window.zunoTestStreak = function() {
            let snapshot = localStorage.getItem(STREAK_SNAPSHOT_KEY);

            if (snapshot === null) {
              snapshot = String(Number(state.streak) || 0);
              localStorage.setItem(STREAK_SNAPSHOT_KEY, snapshot);
            }

            state.streak = (Number(state.streak) || 0) + 1;
            saveState();
            refreshXPDisplays();
            updateStreakStatus();
          };

          window.zunoResetTestStreak = function() {
            const snapshot = localStorage.getItem(STREAK_SNAPSHOT_KEY);

            if (snapshot === null) {
              alert("Es gibt keinen gespeicherten Test-Streak.");
              return;
            }

            state.streak = Math.max(0, Number(snapshot) || 0);
            saveState();
            localStorage.removeItem(STREAK_SNAPSHOT_KEY);

            refreshXPDisplays();
            updateStreakStatus();

            alert("Dein ursprünglicher Streak wurde wiederhergestellt.");
          };

          window.zunoNavigate = function(destination) {
            document.querySelectorAll("[data-zuno-nav]").forEach(button => {
              button.classList.toggle(
                "active",
                button.dataset.zunoNav === destination
              );
            });

            switch (destination) {
              case "menu":
                showDashboard();
                break;

              case "learning":
                showOnly("learningPage");
                break;

              case "stats":
                showStats();
                break;

              case "arcade":
                showArcadePage();
                break;

              case "shop":
                showShopPage();
                break;

              case "admin":
                showAdminPage();
                break;
            }
          };

          window.showXPPage = function() {
            showOnly("xpPage");
            refreshXPDisplays();
          };

          window.showArcadePage = function() {
            showOnly("arcadePage");
            refreshXPDisplays();

            if (typeof renderArcade === "function") {
              renderArcade();
            }
          };

          window.showShopPage = function() {
            showOnly("shopPage");
            renderCosmetics();
          };

          window.showAdminPage = function() {
            if (!adminUnlocked) {
              const entered = prompt("Admin-Passwort:");

              if (entered !== ADMIN_PASSWORD) {
                if (entered !== null) alert("Falsches Passwort.");
                return;
              }

              adminUnlocked = true;
            }

            showOnly("adminPage");
            updateStreakStatus();

            if (window.ZUNOAI && typeof ZUNOAI.updateSuggestionPanel === "function") {
              ZUNOAI.updateSuggestionPanel();
            }
          };

          document.addEventListener("DOMContentLoaded", () => {
            renderCosmetics();
            refreshXPDisplays();
          });

          window.addEventListener("load", () => {
            renderCosmetics();
            refreshXPDisplays();
          });
        })();
        <\/script>
      `;

      const scripts =
        "<script>\n" + patch + "\n<\/script>" +
        speechFixScript +
        appEnhancements +
        '<script src="' + moduleBase + "zuno-ai.js" + version + '"><\/script>' +
        '<script src="' + moduleBase + "zuno-examples.js" + version + '"><\/script>' +
        '<script src="' + moduleBase + "progress.js" + version + '"><\/script>' +
        '<script src="' + moduleBase + "games.js" + version + '"><\/script>';

      page = page.replace("</body>", scripts + "</body>");

      status.textContent = "ZUNO geladen. Starte App ...";
      document.open();
      document.write(page);
      document.close();

    } catch (error) {
      status.className = "error";
      status.textContent = "Fehler beim Laden: " + error.message;
      console.error("ZUNO loading error:", error);
    }
  })();
  </script>
</body>
</html>
