<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7fa">
  <title>ZUNO 2.0</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#20212a;background:#f7f7fa;font-synthesis:none;text-rendering:optimizeLegibility}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    .boot{width:min(440px,100%);padding:30px;background:#fff;border:1px solid #e9e8ef;border-radius:24px;box-shadow:0 18px 55px #20212a12}
    .brand{font-size:26px;font-weight:900;letter-spacing:-1.5px;color:#6558cc}.bar{height:5px;margin:22px 0 12px;overflow:hidden;border-radius:9px;background:#eeecf5}
    .bar:after{content:"";display:block;width:40%;height:100%;border-radius:inherit;background:#8276e8;animation:load 1.1s ease-in-out infinite alternate}
    .hint{color:#777987;font-size:14px;line-height:1.55}.error{color:#a33d32;background:#fff0ed;padding:12px;border-radius:12px;line-height:1.5}
    @keyframes load{to{transform:translateX(150%)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="boot" aria-live="polite">
    <div class="brand">ZUNO<span aria-hidden="true">.</span></div>
    <p id="status">Opening your learning space…</p>
    <div class="bar" aria-hidden="true"></div>
    <p class="hint">Your existing vocabulary, examples, progress system and mascot artwork are being kept intact.</p>
  </main>
  <script>
  (async()=>{
    const sourceUrl="https://raw.githubusercontent.com/KiU10/zuno/c6250a5033428001a8500b6b4cfc5ba95e7fa69c/index.html";
    try{
      const response=await fetch(sourceUrl,{cache:"force-cache"});
      if(!response.ok)throw new Error(`Original app source returned ${response.status}`);
      let html=await response.text();
      const polish=`
        :root{--dark:#20212a;--grey:#f1f0f6;--iris:#7869df;--purple:#6253c4;--lime:#c8f29d;--muted:#696b79;--radius:22px;color-scheme:light}
        body{background:#f7f7fa;color:var(--dark);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.01em}
        header{border-bottom:1px solid #efeff4;box-shadow:0 4px 18px #20212a08;backdrop-filter:blur(14px)}
        .logo{letter-spacing:-2px}.hero{background:#6253c4;box-shadow:0 15px 34px #6253c426}.hero:after{border-color:#ffffff12}
        .primary,.secondary,.option{transition:transform .18s ease,background .18s ease,border-color .18s ease,box-shadow .18s ease}
        .primary{border-radius:13px}.primary:hover:not(:disabled){transform:translateY(-1px)}
        .secondary{border:1px solid #e9e8ef}.card,.panel{border-color:#ecebf2;box-shadow:0 7px 24px #20212a08}
        .card:hover{box-shadow:0 12px 30px #20212a10}.word-card{background:#6253c4;box-shadow:0 12px 28px #6253c422}
        .word-card .target{border-radius:12px}.progress-fill{background:linear-gradient(90deg,#7869df,#c8f29d)}
        button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #7869df80;outline-offset:3px}
        button,.option{min-height:44px}.option{border-radius:14px}.feedback{border-radius:14px}
        @media(max-width:600px){main{margin:18px auto;padding-inline:14px}.hero{align-items:flex-start}.hero img{flex:0 0 auto}}
        @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
      `;
      html=html.replace("</style>",`${polish}</style>`);
      html=html.replace("<title>ZUNO</title>","<title>ZUNO 2.0 — Vocabulary practice</title>");
      html=html.replace(/<script>([\\s\\S]*?)<\\/script>/,(_,code)=>{
        let updated=code;
        updated=updated.replace("state.session=words;state.index=0;state.correct=0;state.wrong=0;","state.session=words;state.index=0;state.correct=0;state.wrong=0;state.sessionFinished=false;");
        updated=updated.replace("function finishSession(){\\n  const total=state.correct+state.wrong;","function finishSession(){\\n  if(state.sessionFinished)return;\\n  state.sessionFinished=true;\\n  const total=state.correct+state.wrong;");
        updated=updated.replace('utterance.lang=word.language==="fr"?"fr-FR":"en-AU";','utterance.lang=state.currentMode==="reverse"?"de-DE":word.language==="fr"?"fr-FR":"en-AU";');
        updated=updated.replace('const sessions=Number(localStorage.getItem("zuno_sessions")||0)+1;\\n  localStorage.setItem("zuno_sessions",sessions);','const sessions=Number(localStorage.getItem("zuno_sessions")||0)+1;\\n  localStorage.setItem("zuno_sessions",sessions);');
        updated=updated.replace('currentMode:"input",answered:false','currentMode:"input",answered:false,sessionFinished:false');
        return `<script>${updated}<\\/script>`;
      });
      document.open();document.write(html);document.close();
    }catch(error){
      document.getElementById("status").outerHTML='<p class="error" role="alert">ZUNO could not load its preserved app source. Check your internet connection and reload. Your existing progress has not been changed.</p>';
      console.error("ZUNO startup failed",error);
    }
  })();
  </script>
</body>
</html>
