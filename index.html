
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7d69e8">
  <title>ZUNO</title>

  <style>
    :root {
      font-family: Inter, "Segoe UI", sans-serif;
      color: #20212a;
      background: #f7f7fa;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
    }

    .logo {
      color: #6351c7;
      font-weight: 900;
      font-size: 26px;
      letter-spacing: -.08em;
    }

    .muted {
      color: #6d7283;
      line-height: 1.55;
    }

    .error {
      background: #ffeceb;
      color: #9d3b33;
      padding: 14px;
      border-radius: 12px;
      line-height: 1.5;
    }

    .track {
      height: 5px;
      border-radius: 9px;
      background: #eceaf5;
      overflow: hidden;
      margin: 20px 0 12px;
    }

    .track span {
      display: block;
      width: 40%;
      height: 100%;
      background: #7d69e8;
      border-radius: inherit;
      animation: load 1s ease-in-out infinite alternate;
    }

    @keyframes load {
      to { transform: translateX(150%); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main id="loader" aria-live="polite" style="
    width:min(440px,calc(100% - 32px));
    margin:15vh auto;
    background:white;
    border:1px solid #ecebf2;
    border-radius:22px;
    padding:26px;
    box-shadow:0 18px 42px #20212a12;
  ">
    <div class="logo">ZUNO.</div>
    <p id="status">Lerninhalte werden geladen …</p>
    <div class="track" aria-hidden="true"><span></span></div>
    <p class="muted">
      Deine Vokabeln, Beispiele, Fortschritte und Maskottchen bleiben erhalten.
    </p>
  </main>

  <script>
  (async function loadZuno() {
    const oldLoader =
      "https://raw.githubusercontent.com/KiU10/ZUNO/e91adbeb9ffd118ca3eeccee2fc6db094dbb6bad/index.html";

    const source =
      "https://raw.githubusercontent.com/KiU10/ZUNO/3ade70981b096db00dd74d30e5eaf067d50263bc/index.html";

    const moduleBase = "./";
    const version = "?v=13";
    const status = document.getElementById("status");

    async function fetchText(url) {
      const response = await fetch(url, { cache: "no-store" });

      if (!response.ok) {
        throw new Error("GitHub antwortet mit HTTP " + response.status);
      }

      return response.text();
    }

    try {
      status.textContent = "Lade deine bisherigen Lerninhalte ...";

      /* BISHERIGEN ZUNO-PATCH LADEN */
      const previousLoader = await fetchText(oldLoader);
      const startMarker = "const patch = String.raw";
      const patchStart = previousLoader.indexOf(startMarker);

      if (patchStart === -1) {
        throw new Error("Der bisherige Vokabel-Patch wurde nicht gefunden.");
      }

      const contentStart = patchStart + startMarker.length;
      const openingBacktick = previousLoader.indexOf("`", contentStart);
      const tryMarker = "\n    try {";

      const tryPosition = previousLoader.indexOf(
        tryMarker,
        openingBacktick + 1
      );

      const closingBacktick = previousLoader.lastIndexOf(
        "`",
        tryPosition
      );

      if (
        openingBacktick === -1 ||
        tryPosition === -1 ||
        closingBacktick <= openingBacktick
      ) {
        throw new Error("Der bisherige Vokabel-Patch konnte nicht gelesen werden.");
      }

      let patch = previousLoader.slice(
        openingBacktick + 1,
        closingBacktick
      );

      patch = patch.replace(/<\/script/gi, "<\\/script");

      status.textContent = "Verbinde mit der ZUNO-App ...";

      let page = await fetchText(source);

      /* PATCH: JETZT LERNEN ZUR SPRACHAUSWAHL */
      const oldLearningButton =
        'onclick="showGeneralSettings()">Jetzt lernen</button>';

      if (!page.includes(oldLearningButton)) {
        throw new Error("Der Button 'Jetzt lernen' wurde nicht gefunden.");
      }

      page = page.replace(
        oldLearningButton,
        'onclick="zunoNavigate(\'learning\')">Jetzt lernen</button>'
      );

      if (!page.includes("</body>") || !page.includes("</head>")) {
        throw new Error("Die geladene ZUNO-Datei ist unvollständig.");
      }

      /* LETZTE FRAGE AUTOMATISCH ABSCHLIESSEN */
      const answerPattern =
        /      updateDashboard\(\);\n\n      if \(isCorrect\) \{[\s\S]*?\n      \}\n    \}\n\n    function recordSchoolAnswer/;

      const fixedAnswerFlow = `      updateDashboard();

      const isLastQuestion =
        state.index === state.session.length - 1;

      if (isLastQuestion) {
        document.getElementById('nextButton').classList.add('hidden');

        window.setTimeout(() => {
          if (
            state.answered &&
            !state.sessionFinished &&
            state.index === state.session.length - 1
          ) {
            finishSession();
          }
        }, 1500);

      } else if (isCorrect) {
        document.getElementById('nextButton').classList.add('hidden');

        window.setTimeout(() => {
          if (state.answered && state.index < state.session.length - 1) {
            nextQuestion();
          }
        }, 1500);

      } else {
        document.getElementById('nextButton').classList.remove('hidden');
        document.getElementById('nextButton').focus();
      }
    }

    function recordSchoolAnswer`;

      if (!answerPattern.test(page)) {
        throw new Error("Der Antwortablauf wurde in der Original-App nicht gefunden.");
      }

      page = page.replace(answerPattern, fixedAnswerFlow);

      /* XP-BUTTON */
      const oldXPButton =
        '<span class="pill">⚡ <span id="headerXP">0</span> XP</span>';

      const newXPButton =
        '<button class="pill zuno-xp-trigger" type="button" ' +
        'onclick="showXPPage()" aria-label="XP-Übersicht öffnen">' +
        '⚡ <span id="headerXP">0</span> XP</button>';

      if (!page.includes(oldXPButton)) {
        throw new Error("Der XP-Button wurde in der Original-App nicht gefunden.");
      }

      page = page.replace(oldXPButton, newXPButton);

      /* DASHBOARD: LERNKARTEN ENTFERNEN */
      const dashboardCardsPattern =
        /      <h2>Was möchtest du üben\?<\/h2>\s*<div class="card-grid">[\s\S]*?<\/div>\s*<\/section>/;

      if (!dashboardCardsPattern.test(page)) {
        throw new Error("Der alte Lernbereich auf dem Dashboard wurde nicht gefunden.");
      }

      page = page.replace(
        dashboardCardsPattern,
        "    </section>"
      );

      /* SEITEN FÜR DIE NEUE NAVIGATION */
      const newPages = `
        <section id="xpPage" class="hidden zuno-page">
          <div class="zuno-page-heading">
            <span class="zuno-eyebrow">DEIN FORTSCHRITT</span>
            <h1>Deine XP.</h1>
            <p>Verdiene Erfahrung, bleib aktiv und schalte neue Dinge frei.</p>
          </div>

          <div class="zuno-xp-balance">
            <span class="zuno-xp-symbol">⚡</span>
            <div>
              <span class="zuno-xp-label">Dein Kontostand</span>

            </div>
          </div>

          <div class="zuno-info-grid">
            <article class="zuno-info-card">

              <h3>XP verdienen</h3>

            </article>

            <article class="zuno-info-card">
              <span>🎮</span>
              <h3>XP ausgeben</h3>
              <p>Eine neue Spielrunde kostet 50 XP.</p>
            </article>
          </div>

          <div class="zuno-streak-card">
            🔥 <strong><span id="zunoXPStreak">0</span>-Tage-Streak</strong>
            <p>Bleib täglich dran, um deinen Fortschritt aufzubauen.</p>
          </div>

          <button class="zuno-wide-button" onclick="showArcadePage()">

        </section>

        <section id="arcadePage" class="hidden zuno-page">

            <h1>🎮 ZUNO Arcade</h1>
            <p>Spiele kleine Games und sammle XP.</p>
          </div>

          <div id="zunoArcade">
            <div class="zuno-game-grid" id="zunoGameGrid"></div>
          </div>
        </section>

        <section id="learningPage" class="hidden zuno-page">

          <div class="zuno-language-grid">

            </button>
          </div>
        </section>

        <section id="englishLearningPage" class="hidden zuno-page">
          <button class="zuno-back-button" onclick="zunoNavigate('learning')">
            ← Sprachauswahl
          </button>

          <div class="zuno-page-heading">
            <span class="zuno-eyebrow">ENGLISH</span>
            <h1>Englisch.</h1>
            <p>Wie möchtest du deinen Wortschatz trainieren?</p>
          </div>

          <div class="zuno-info-grid">
            <article class="zuno-info-card">
              <span>🌍</span>
              <h3>Allgemein üben</h3>
              <p>Trainiere deinen allgemeinen englischen Wortschatz.</p>
              <button class="zuno-card-button" onclick="zunoStartGeneral('en')">

              </button>
            </article>

            <article class="zuno-info-card">
              <span>📚</span>

              <button class="zuno-card-button" onclick="zunoStartUnits('en')">

              </button>
            </article>
          </div>
        </section>

        <section id="frenchLearningPage" class="hidden zuno-page">
          <button class="zuno-back-button" onclick="zunoNavigate('learning')">
            ← Sprachauswahl
          </button>

          <div class="zuno-page-heading">
            <span class="zuno-eyebrow">FRANÇAIS</span>
            <h1>Französisch.</h1>
            <p>Comment veux-tu t'entraîner aujourd'hui?</p>
          </div>

          <div class="zuno-info-grid">
            <article class="zuno-info-card">
              <span>🌍</span>
              <h3>Allgemein üben</h3>
              <p>Trainiere deinen allgemeinen französischen Wortschatz.</p>
              <button class="zuno-card-button" onclick="zunoStartGeneral('fr')">
                Allgemein üben
              </button>
            </article>

            <article class="zuno-info-card">
              <span>📚</span>
              <h3>Nach Unités üben</h3>
              <p>Übe die Vokabeln aus deinem Französischbuch.</p>
              <button class="zuno-card-button" onclick="zunoStartUnits('fr')">
                Unités öffnen
              </button>
            </article>
          </div>
        </section>

        <section id="frenchUnitSettings" class="hidden zuno-page">
          <button class="zuno-back-button" onclick="zunoNavigate('french')">
            ← Französisch
          </button>

          <div class="zuno-page-heading">
            <span class="zuno-eyebrow">FRANÇAIS · VOCABULAIRE SCOLAIRE</span>
            <h1>Nach Unités üben.</h1>
            <p>Wähle eine Unité und anschließend einen Atelier-Bereich.</p>
          </div>

          <div class="zuno-selection-panel">
            <label for="zunoFrenchUnit">Unité</label>
            <select id="zunoFrenchUnit">
              <option value="unite1">Unité 1 · De l'ouest à l'est dans le Grand Est</option>
              <option value="unite2">Unité 2 · France - Allemagne: quelle histoire!</option>
            </select>

            <label for="zunoFrenchAtelier">Atelier / Bereich</label>
            <select id="zunoFrenchAtelier">
              <option value="all">Alle Bereiche</option>
              <option value="rappelles">Tu te rappelles?</option>
              <option value="atelierA">Atelier A</option>
              <option value="atelierB">Atelier B</option>
              <option value="atelierC">Atelier C</option>
              <option value="atelierD">Atelier D</option>
              <option value="dico">Mon dico personnel</option>
            </select>

            <button class="zuno-card-button" onclick="startFrenchUnit()">
              Training starten
            </button>
          </div>
        </section>

        <section id="adminPage" class="hidden zuno-page">
          <div class="zuno-page-heading">
            <span class="zuno-eyebrow">ZUNO CONTROL CENTER</span>
            <h1>Admin.</h1>
            <p>Verwalte Vorschläge und teste Funktionen der App.</p>
          </div>

          <div class="zuno-admin-card">
            <h2>🔥 Streak-Test</h2>
            <p>
              Der ursprüngliche Streak wird beim ersten Test gespeichert.
              Mit Reset stellst du ihn wieder her.
            </p>

            <div class="zuno-admin-actions">
              <button class="zuno-admin-button" onclick="zunoTestStreak()">
                +1 Streak
              </button>

              <button class="zuno-admin-button secondary" onclick="zunoResetTestStreak()">
                Reset Streak
              </button>
            </div>

            <p id="zunoStreakTestStatus" class="zuno-admin-status">
              Aktueller Streak: wird geladen ...
            </p>
          </div>

          <div class="zuno-admin-card">
            <h2>🧠 ZUNO AI</h2>
            <p>Synonym-Vorschläge und Antwortalternativen prüfen.</p>
            <div id="zunoAIAdminPanel"></div>
          </div>

          <div class="zuno-admin-card">
            <h2>🧪 System</h2>
            <p>Diese Seite ist für Tests und die Verwaltung der App gedacht.</p>
            <button class="zuno-admin-button secondary" onclick="showDashboard()">
              Zurück zum Menü
            </button>
          </div>
        </section>
      `;

      if (!page.includes("</main>")) {
        throw new Error("Der Hauptbereich der App wurde nicht gefunden.");
      }

      page = page.replace("</main>", newPages + "</main>");

      /* NEUE SEITEN IN DIE SEITENNAVIGATION AUFNEHMEN */
      const oldPageList =
        "['dashboard', 'settings', 'unitSettings', 'exercise', 'result', 'statsPage']";

      const newPageList =
        "['dashboard', 'settings', 'unitSettings', 'exercise', 'result', 'statsPage', 'xpPage', 'arcadePage', 'learningPage', 'englishLearningPage', 'frenchLearningPage', 'frenchUnitSettings', 'adminPage']";

      if (!page.includes(oldPageList)) {
        throw new Error("Die Seitennavigation der App wurde nicht gefunden.");
      }

      page = page.replace(oldPageList, newPageList);

      /* ALLGEMEINE SPRACHAUSWAHL AUSBLENDEN */
      const languageSettingsPattern =
        /        <label for="generalLanguage"[\s\S]*?<\/select>\s*/;

      if (!languageSettingsPattern.test(page)) {
        throw new Error("Die Sprachauswahl in den allgemeinen Einstellungen wurde nicht gefunden.");
      }

      page = page.replace(languageSettingsPattern, "");

      /* NEUE STYLES */
      const styles = `
        <link rel="stylesheet" href="${moduleBase}games.css${version}">
        <link rel="stylesheet" href="${moduleBase}animations.css${version}">

        <style>

            --zuno-purple: #7d69e8;

          }

          body { padding-left: 250px; }

          #zunoSidebar {
            position: fixed;
            inset: 0 auto 0 0;
            z-index: 100;
            width: 230px;

            border-right: 1px solid var(--zuno-line);
          }

          .zuno-sidebar-logo {
            padding: 0 12px 28px;

            padding: 0 12px;

          }

          }

          .zuno-nav button:hover,
          .zuno-nav button.active {

          }

            margin-top: auto;

          }

          body > header { padding-left: 34px; }

          body > main {
            max-width: 1120px;
            margin: 28px auto 72px;

          }

              height: 100%;
              display: grid;
              grid-template-columns: repeat(5,minmax(0,1fr));
              gap: 2px;
            }

            .zuno-nav button {
              min-width: 0;
              height: 100%;
              padding: 5px 1px;
              display: flex;
              flex-direction: column;
              justify-content: center;
              gap: 3px;
              border-radius: 10px;
              font-size: 9px;
            }

            .zuno-nav-icon {
              width: auto;
              font-size: 18px;
            }

            body > header { padding: 13px 15px; }
            body > main { padding: 0 15px; margin-top: 20px; }
            .zuno-info-grid,
            .zuno-language-grid { grid-template-columns: 1fr; }
          }

          @media (max-width: 390px) {
            .zuno-nav button { font-size: 8px; }
            .zuno-nav-icon { font-size: 16px; }
          }
        </style>
      `;

      page = page.replace("</head>", styles + "</head>");

      /* SIDEBAR */
      const sidebar = `
        <aside id="zunoSidebar">
          <div class="zuno-sidebar-logo">ZUNO.</div>
          <div class="zuno-nav-label">WORKSPACE</div>

          <nav class="zuno-nav" aria-label="Hauptnavigation">
            <button type="button" onclick="zunoNavigate('menu')" data-zuno-nav="menu">
              <span class="zuno-nav-icon">⌂</span><span>Menü</span>
            </button>

            <button type="button" onclick="zunoNavigate('learning')" data-zuno-nav="learning">
              <span class="zuno-nav-icon">📚</span><span>Lernen</span>
            </button>

            <button type="button" onclick="zunoNavigate('stats')" data-zuno-nav="stats">
              <span class="zuno-nav-icon">▥</span><span>Stats</span>
            </button>

            <button type="button" onclick="zunoNavigate('arcade')" data-zuno-nav="arcade">
              <span class="zuno-nav-icon">🎮</span><span>Arcade</span>
            </button>

            <button type="button" onclick="zunoNavigate('admin')" data-zuno-nav="admin">
              <span class="zuno-nav-icon">⚙</span><span>Admin</span>
            </button>
          </nav>

          <div class="zuno-sidebar-bottom">ZUNO · Learn something new.</div>
        </aside>
      `;

      page = page.replace("<body>", "<body>\n" + sidebar);

      /* SPRACHAUSGABE */
      const speechFixScript = `
        <script>
        (function() {
          window.speakCurrentWord = function() {
            if (
              !('speechSynthesis' in window) ||
              typeof SpeechSynthesisUtterance === 'undefined'
            ) {
              const feedback = document.getElementById('feedbackArea');

              if (feedback) {
                feedback.innerHTML =
                  '<div class="feedback bad" role="status">' +
                  'Die Sprachausgabe wird von diesem Browser nicht unterstützt.' +
                  '</div>';
              }

              return;
            }

            const word = state.session[state.index];
            if (!word) return;

            const isReverse = state.currentMode === 'reverse';
            const text = isReverse ? word.translation : word.word;

            const languageCode = isReverse
              ? 'de-DE'
              : word.language === 'fr'
                ? 'fr-FR'
                : 'en-AU';

            try {
              window.speechSynthesis.cancel();

              const utterance = new SpeechSynthesisUtterance(text);
              utterance.lang = languageCode;
              utterance.rate = 0.88;
              utterance.pitch = 1;

              const voices = window.speechSynthesis.getVoices();
              const prefix = languageCode.slice(0, 2).toLowerCase();

              const matching = voices.filter(voice =>
                voice.lang && voice.lang.toLowerCase().startsWith(prefix)
              );

              const preferred =
                matching.find(voice =>
                  voice.lang.toLowerCase() === languageCode.toLowerCase()
                ) || matching[0];

              if (preferred) utterance.voice = preferred;
              window.speechSynthesis.speak(utterance);

            } catch (error) {
              console.error('ZUNO speech error:', error);
            }
          };
        })();
        <\/script>
      `;

      /* NAVIGATION, XP UND ADMIN */
      const appEnhancements = `
        <script>
        (() => {
          "use strict";

          const ADMIN_PASSWORD = "iLoveKiU";
          const STREAK_SNAPSHOT_KEY = "zuno_admin_streak_snapshot_v1";

          let adminUnlocked = false;
          let selectedLanguage = "en";

          function refreshXPDisplays() {
            const xp = Number(state.xp) || 0;

            const balance = document.getElementById("zunoXPBalance");
            if (balance) balance.textContent = xp;

            const streak = Number(state.streak) || 0;
            const streakElement = document.getElementById("zunoXPStreak");

            if (streakElement) streakElement.textContent = streak;
          }

          function updateStreakStatus() {
            const status = document.getElementById("zunoStreakTestStatus");
            if (!status) return;

            status.textContent = "Aktueller Streak: " + state.streak + " Tage";
          }

          window.zunoTestStreak = function() {
            let snapshot = localStorage.getItem(STREAK_SNAPSHOT_KEY);

            if (snapshot === null) {
              snapshot = String(Number(state.streak) || 0);
              localStorage.setItem(STREAK_SNAPSHOT_KEY, snapshot);
            }

            state.streak = (Number(state.streak) || 0) + 1;
            saveState();
            refreshXPDisplays();
            updateStreakStatus();
          };

          window.zunoResetTestStreak = function() {
            const snapshot = localStorage.getItem(STREAK_SNAPSHOT_KEY);

            if (snapshot === null) {
              alert("Es gibt keinen gespeicherten Test-Streak.");
              return;
            }

            state.streak = Math.max(0, Number(snapshot) || 0);
            saveState();
            localStorage.removeItem(STREAK_SNAPSHOT_KEY);

            refreshXPDisplays();
            updateStreakStatus();

            alert("Dein ursprünglicher Streak wurde wiederhergestellt.");
          };

          function setActiveNavigation(destination) {
            document.querySelectorAll("[data-zuno-nav]").forEach(button => {
              button.classList.toggle(
                "active",
                button.dataset.zunoNav === destination
              );
            });
          }

          window.zunoNavigate = function(destination) {
            setActiveNavigation(destination);

            switch (destination) {
              case "menu":
                showDashboard();
                break;

              case "learning":
                showOnly("learningPage");
                break;

              case "stats":
                showStats();
                break;

              case "arcade":
                showArcadePage();
                break;

              case "admin":
                showAdminPage();
                break;

              case "french":
                showOnly("frenchLearningPage");
                break;
            }
          };

          window.zunoChooseLanguage = function(language) {
            selectedLanguage = language;

            if (language === "fr") {
              showOnly("frenchLearningPage");
            } else {
              showOnly("englishLearningPage");
            }
          };

          window.zunoStartGeneral = function(language) {
            selectedLanguage = language;

            const languageSelect = document.getElementById("generalLanguage");

            if (languageSelect) {
              languageSelect.value = language;
            }

            state.sessionLanguage = language;
            showGeneralSettings();
          };

          window.zunoStartUnits = function(language) {
            selectedLanguage = language;

            if (language === "fr") {
              showOnly("frenchUnitSettings");
              return;
            }

            showUnitSettings();
          };

          window.startFrenchUnit = function() {
            const unit = document.getElementById("zunoFrenchUnit").value;
            const atelier = document.getElementById("zunoFrenchAtelier").value;

            if (window.ZUNOFrench && typeof window.ZUNOFrench.startUnit === "function") {
              window.ZUNOFrench.startUnit(unit, atelier);
              return;
            }

            alert("Die französischen Vokabeln werden im nächsten Schritt eingebunden.");
          };

          window.showXPPage = function() {
            showOnly("xpPage");
            refreshXPDisplays();
          };

          window.showArcadePage = function() {
            showOnly("arcadePage");
            refreshXPDisplays();

            if (typeof renderArcade === "function") {
              renderArcade();
            }
          };

          window.showAdminPage = function() {
            if (!adminUnlocked) {
              const entered = prompt("Admin-Passwort:");

              if (entered !== ADMIN_PASSWORD) {
                if (entered !== null) alert("Falsches Passwort.");
                return;
              }

              adminUnlocked = true;
            }

            showOnly("adminPage");
            updateStreakStatus();

            if (
              window.ZUNOAI &&
              typeof window.ZUNOAI.updateSuggestionPanel === "function"
            ) {
              window.ZUNOAI.updateSuggestionPanel();
            }
          };

          /* ENGLISCH UND FRANZÖSISCH AUSWAHL IN DEN EINSTELLUNGEN */
          const originalShowGeneralSettings = window.showGeneralSettings;

          window.showGeneralSettings = function() {
            const languageSelect = document.getElementById("generalLanguage");

            if (languageSelect) {
              languageSelect.value = selectedLanguage;
            }

            if (typeof originalShowGeneralSettings === "function") {
              originalShowGeneralSettings();
            }
          };

          const originalShowUnitSettings = window.showUnitSettings;

          window.showUnitSettings = function() {
            if (selectedLanguage === "fr") {
              showOnly("frenchUnitSettings");
              return;
            }

            if (typeof originalShowUnitSettings === "function") {
              originalShowUnitSettings();
            }
          };

          document.addEventListener("DOMContentLoaded", refreshXPDisplays);
          window.addEventListener("load", refreshXPDisplays);
        })();
        <\/script>
      `;

      const scripts =
        "<script>\n" + patch + "\n<\/script>" +
        speechFixScript +
        appEnhancements +
        '<script src="' + moduleBase + "zuno-ai.js" + version + '"><\/script>' +
        '<script src="' + moduleBase + "zuno-examples.js" + version + '"><\/script>' +
        '<script src="' + moduleBase + "progress.js" + version + '"><\/script>' +
        '<script src="' + moduleBase + "games.js" + version + '"><\/script>';

      page = page.replace("</body>", scripts + "</body>");

      status.textContent = "ZUNO geladen. Starte App ...";
      document.open();
      document.write(page);
      document.close();

    } catch (error) {
      status.className = "error";
      status.textContent = "Fehler beim Laden: " + error.message;
      console.error("ZUNO loading error:", error);
    }
  })();
  </script>
</body>
</html>
