<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7d69e8">
  <title>ZUNO 2.0</title>
  <style>
    :root{font-family:Inter,"Segoe UI",sans-serif;color:#20212a;background:#f7f7fa}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(440px,100%);background:#fff;border:1px solid #ecebf2;border-radius:22px;padding:26px;box-shadow:0 18px 42px #20212a12}
    .logo{color:#6351c7;font-weight:900;font-size:26px;letter-spacing:-.08em}.muted{color:#6d7283;line-height:1.55}
    .error{background:#ffeceb;color:#9d3b33;padding:14px;border-radius:12px;line-height:1.5}
    .track{height:5px;border-radius:9px;background:#eceaf5;overflow:hidden;margin:20px 0 12px}.track span{display:block;width:40%;height:100%;background:#7d69e8;border-radius:inherit;animation:load 1s ease-in-out infinite alternate}
    @keyframes load{to{transform:translateX(150%)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <main aria-live="polite">
    <div class="logo">ZUNO.</div>
    <p id="status">Lerninhalte werden geladen …</p>
    <div class="track" aria-hidden="true"><span></span></div>
    <p class="muted">Deine bestehenden Vokabeln, Beispiele, Fortschritte und Maskottchen bleiben erhalten.</p>
  </main>
  <script>
  (async () => {
    const source = "https://raw.githubusercontent.com/KiU10/ZUNO/3ade70981b096db00dd74d30e5eaf067d50263bc/index.html";
    const improvements = `
      const curatedExamples = {
        "to overhear": ["I overheard my neighbours talking about their holiday.", "She accidentally overheard an interesting conversation.", "We overheard the announcement while waiting for the train."],
        "achieve": ["She trained every day to achieve her goal.", "Our team achieved an important victory.", "You can achieve great things if you keep practising."],
        "to be short of sth": ["We are short of time, so let's take the earlier bus.", "The team is short of players before the final.", "They were short of money, so they cooked at home."],
        "to immigrate": ["Her grandparents immigrated to Australia in the 1950s.", "Many people immigrate to build a safer life.", "The family immigrated together and settled near the coast."],
        "to emigrate": ["They emigrated from Ireland to start over abroad.", "He emigrated when he found work in another country.", "Her family emigrated several generations ago."],
        "immigrant": ["The museum recorded the stories of immigrant families.", "As a young immigrant, he had to learn a new language.", "The city welcomed immigrants from many countries."],
        "immigration": ["The class discussed immigration and its effect on communities.", "Immigration has shaped the history of the country.", "The report explains recent changes to immigration."],
        "migration": ["Bird migration begins when the weather turns cold.", "The map shows the migration of families across the region.", "Seasonal migration brings the animals to the coast."],
        "to apply (for)": ["I want to apply for a weekend job at the bookshop.", "She applied for a place on the exchange programme.", "You need to apply before the closing date."],
        "to bump into sb": ["I bumped into my cousin at the station.", "We often bump into our neighbours at the market.", "She bumped into an old friend on her way home."],
        "to learn by heart": ["We had to learn the short poem by heart.", "He learned the speech by heart before the presentation.", "I learn new phrases by heart by saying them aloud."],
        "to make progress": ["After a month of practice, she made real progress.", "You make progress when you keep trying.", "The group has made progress on its project."],
        "to communicate": ["The radio helps the rescue team communicate in the outback.", "They communicate clearly even when the room is noisy.", "A smile can help people communicate across languages."],
        "to prevent": ["A helmet can prevent serious head injuries.", "The warning signs help prevent accidents near the water.", "Good planning can prevent delays."],
        "to assist": ["A guide assisted the visitors at the wildlife centre.", "The new ramp assists people who use wheelchairs.", "Volunteers came to assist after the storm."],
        "to settle": ["They settled in a small town near the sea.", "It took a few weeks to settle into her new school.", "The family settled near relatives after moving abroad."],
        "to be stuck": ["Our car was stuck in the mud after the rain.", "I got stuck on the last question in the quiz.", "The hikers were stuck until the rescue team arrived."],
        "to respect": ["Visitors should respect the signs on the sacred site.", "We respect one another's beliefs.", "The students respect the local community's traditions."],
        "to distract": ["Please put your phone away; it distracts everyone.", "The loud music distracted me from my reading.", "She closed the door to avoid being distracted."],
        "community": ["The community organised a clean-up at the beach.", "A close-knit community supported the new family.", "The community centre offers free activities for children."],
        "ancestor": ["An ancestor of mine came to Australia long ago.", "The old photograph showed one of her ancestors.", "They learned how their ancestors lived from the museum exhibit."],
        "to glow": ["The lighthouse began to glow as the sun went down.", "Her lantern glowed in the dark tent.", "The windows glowed warmly on the cold evening."],
        "to sigh": ["He sighed with relief when the missing dog came home.", "She sighed and looked at the long list of chores.", "I heard him sigh after the difficult exam."],
        "to sting": ["A bee may sting if it feels threatened.", "The jellyfish can sting swimmers near the shore.", "The nettle stung his hand when he touched it."],
        "to succeed (in)": ["She succeeded in finding the right track.", "With practice, he succeeded in speaking more confidently.", "The team succeeded in raising money for the shelter."],
        "to manage (to do sth)": ["We managed to catch the last bus.", "He managed to finish the project before dinner.", "Can you manage to carry both bags?"],
        "to head (for/to)": ["At sunrise, we headed for the coast.", "They headed to the station after lunch.", "The hikers headed for the shelter before the storm."],
        "to take responsibility": ["The captain took responsibility for the team's decision.", "Everyone should take responsibility for their own work.", "She took responsibility and apologised."],
        "to be responsible for": ["Mia is responsible for looking after the class plants.", "The council is responsible for maintaining the footpath.", "He is responsible for organising the presentation."],
        "to apply for": ["He applied for a summer job at the museum.", "You can apply for the course online.", "She applied for a place at the school."],
        "box jellyfish": ["A box jellyfish drifted near the warning buoy.", "The sign warns swimmers about box jellyfish.", "The guide explained why box jellyfish can be dangerous."],
        "rip current": ["The lifeguard spotted a rip current near the rocks.", "A rip current can pull swimmers away from the shore.", "The beach is closed because of a strong rip current."],
        "heatwave": ["During the heatwave, the library stayed open late.", "The heatwave dried out the garden.", "People carried extra water during the heatwave."],
        "native speaker": ["A native speaker helped us practise the dialogue.", "She spoke with a native speaker during her exchange.", "The class asked a native speaker about local expressions."],
        "official language": ["English is an official language in Australia.", "The country recognises more than one official language.", "They translated the notice into the official language."],
        "to communicate": ["The radio helps the rescue team communicate in the outback.", "They communicate clearly even when the room is noisy.", "A smile can help people communicate across languages."]
      };
      Object.assign(exampleSentences, curatedExamples);
      function getExample(word) {
        const key = String(word).toLowerCase();
        const exact = exampleSentences[key];
        if (!exact || !exact.length) return null;
        const index = exampleRotations[key] || 0;
        exampleRotations[key] = (index + 1) % exact.length;
        return exact[index];
      }
      function renderQuestion() {
        const word = state.session[state.index];
        if (!word) return finishSession();
        state.answered = false;
        document.getElementById('questionCounter').textContent = `${state.index + 1} / ${state.session.length}`;
        document.getElementById('lessonProgress').style.width = `${(state.index / state.session.length) * 100}%`;
        document.getElementById('feedbackArea').innerHTML = '';
        document.getElementById('nextButton').classList.add('hidden');
        const mode = getModes()[state.index % 3];
        state.currentMode = mode;
        const target = document.getElementById('targetWord');
        const example = document.getElementById('exampleSentence');
        const mascot = document.getElementById('exerciseMascot');
        mascot.src = 'IMG_2558.png';
        if (mode === 'reverse') {
          const answerLanguage = word.language === 'fr' ? 'Französisch' : 'Englisch';
          document.getElementById('modeLabel').textContent = `Wie heißt das auf ${answerLanguage}?`;
          target.textContent = word.translation;
          example.classList.add('hidden');
          example.textContent = '';
          mascot.src = 'IMG_2560.png';
        } else {
          document.getElementById('modeLabel').textContent = mode === 'choice' ? 'Wähle die richtige Übersetzung' : 'Übersetze das Wort';
          target.textContent = word.word;
          const sentence = getExample(word.word);
          if (sentence) {
            example.innerHTML = highlightWord(sentence, word.word);
            example.classList.remove('hidden');
          } else {
            example.textContent = '';
            example.classList.add('hidden');
          }
          if (mode === 'choice') mascot.src = 'IMG_2560.png';
        }
        renderAnswerArea(word);
      }
      function speakCurrentWord() {
        if (!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined') {
          const feedback = document.getElementById('feedbackArea');
          feedback.innerHTML = '<div class="feedback bad" role="status">Die Sprachausgabe wird von diesem Browser nicht unterstützt.</div>';
          return;
        }
        const word = state.session[state.index];
        if (!word) return;
        const isReverse = state.currentMode === 'reverse';
        const text = isReverse ? word.translation : word.word;
        const lang = isReverse ? 'de-DE' : (word.language === 'fr' ? 'fr-FR' : 'en-AU');
        try {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = lang;
          utterance.rate = 0.88;
          utterance.pitch = 1;
          const voices = window.speechSynthesis.getVoices();
          const prefix = lang.slice(0, 2).toLowerCase();
          const matches = voices.filter((voice) => voice.lang && voice.lang.toLowerCase().startsWith(prefix));
          const preferred = prefix === 'en'
            ? (matches.find((voice) => /australia|en-au/i.test(voice.lang + ' ' + voice.name)) || matches[0])
            : matches.find((voice) => voice.lang.toLowerCase() === lang.toLowerCase()) || matches[0];
          if (preferred) utterance.voice = preferred;
          window.speechSynthesis.speak(utterance);
        } catch (error) {
          console.warn('Speech synthesis unavailable', error);
          document.getElementById('feedbackArea').innerHTML = '<div class="feedback bad" role="status">Audio kann gerade nicht abgespielt werden.</div>';
        }
      }
      function normalize(text) {
        return String(text).normalize('NFKC').toLowerCase().trim()
          .replace(/[’‘]/g, "'")
          .replace(/\bsth\b\.?/g, 'something').replace(/\bsb\b\.?/g, 'somebody')
          .replace(/\betw\b\.?/g, 'etwas').replace(/\bjmdm\b\.?/g, 'jemandem').replace(/\bjmdn\b\.?/g, 'jemanden')
          .replace(/\b(etw|etw\.)\b/g, 'etwas')
          .replace(/[.,!?;:]+/g, ' ').replace(/[()]/g, ' ').replace(/\s+/g, ' ').trim();
      }
      const acceptedGermanByEnglish = {
        'to be short of sth': ['etw. nicht genug haben', 'nicht genug von etwas haben', 'zu wenig von etwas haben'],
        'to manage (to do sth)': ['es schaffen, etwas zu tun', 'etwas schaffen', 'es schaffen'],
        'to bump into sb': ['jemandem zufällig begegnen', 'jemanden zufällig treffen', 'zufällig jemanden treffen'],
        'to learn by heart': ['auswendig lernen', 'im gedächtnis behalten'],
        'to make progress': ['fortschritte machen', 'sich verbessern'],
        'to be stuck': ['feststecken', 'stecken bleiben'],
        'to immigrate': ['einwandern', 'in ein anderes land ziehen'],
        'to emigrate': ['auswandern', 'das eigene land verlassen'],
        'to apply for': ['sich bewerben um', 'beantragen'],
        'to communicate': ['kommunizieren', 'sich verständigen'],
        'to overhear': ['zufällig mithören', 'unbeabsichtigt hören'],
        'to assist': ['helfen', 'unterstützen']
      };
      const acceptedEnglishByGerman = {
        'etw. nicht genug haben': ['to be short of something', 'to be short of sth'],
        'einwandern': ['to immigrate'],
        'auswandern': ['to emigrate'],
        'zufällig mithören': ['to overhear'],
        'kommunizieren': ['to communicate']
      };
      function expectedAnswers(word) {
        const expected = state.currentMode === 'reverse' ? word.word : word.translation;
        const answers = expected.split(';').map((part) => part.trim()).filter(Boolean);
        if (state.currentMode === 'reverse') {
          const germanKey = normalize(word.translation);
          for (const [german, english] of Object.entries(acceptedEnglishByGerman)) {
            if (normalize(german) === germanKey) answers.push(...english);
          }
        } else {
          answers.push(...(acceptedGermanByEnglish[word.word.toLowerCase()] || []));
        }
        return [...new Set(answers.map(normalize))];
      }
      function editDistance(a, b) {
        if (Math.abs(a.length - b.length) > 1) return 2;
        let previous = Array.from({length: b.length + 1}, (_, i) => i);
        for (let i = 1; i <= a.length; i++) {
          const current = [i];
          for (let j = 1; j <= b.length; j++) {
            current[j] = Math.min(current[j - 1] + 1, previous[j] + 1, previous[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
          }
          previous = current;
        }
        return previous[b.length];
      }
      function answerMatches(answer, word) {
        const candidate = normalize(answer);
        if (!candidate) return false;
        const expected = expectedAnswers(word);
        if (expected.includes(candidate)) return true;
        if (candidate.split(' ').length === 1) {
          return expected.some((item) => item.split(' ').length === 1 && candidate.length >= 5 && editDistance(candidate, item) === 1);
        }
        return false;
      }
      function checkAnswer(answer, word) {
        if (state.answered) return;
        state.answered = true;
        const isCorrect = answerMatches(answer, word);
        if (isCorrect) {
          state.correct += 1;
          state.xp += 10;
          if (word.school) state.learned = [...new Set([...state.learned, word.id])];
        } else {
          state.wrong += 1;
        }
        if (word.school) recordSchoolAnswer(word, isCorrect);
        saveState();
        document.querySelectorAll('.option').forEach((button) => {
          button.disabled = true;
          const optionText = button.querySelector('span:last-child')?.textContent || button.textContent;
          if (answerMatches(optionText, word)) button.classList.add('correct');
          else if (normalize(optionText) === normalize(answer)) button.classList.add('wrong');
        });
        document.querySelectorAll('#answerArea input, #answerArea button').forEach((element) => { element.disabled = true; });
        const correctAnswer = (state.currentMode === 'reverse' ? word.word : word.translation).split(';')[0].trim();
        const close = !isCorrect && expectedAnswers(word).some((item) => {
          const candidate = normalize(answer);
          return item && candidate && (item.includes(candidate) || candidate.includes(item));
        });
        const message = isCorrect ? '✓ Richtig! +10 XP' : close
          ? `Fast richtig – achte auf die genaue Bedeutung. Richtig wäre: ${escapeHTML(correctAnswer)}`
          : `✕ Nicht ganz. Richtig wäre: ${escapeHTML(correctAnswer)}`;
        document.getElementById('feedbackArea').innerHTML = `<div class="feedback ${isCorrect ? 'good' : 'bad'}" role="status">${message}</div>`;
        document.getElementById('exerciseMascot').src = isCorrect ? 'IMG_2562.png' : 'IMG_2560.png';
        updateDashboard();
        if (isCorrect) {
          document.getElementById('nextButton').classList.add('hidden');
          window.setTimeout(() => {
            if (state.answered && state.index < state.session.length - 1) nextQuestion();
          }, 1500);
        } else {
          document.getElementById('nextButton').classList.remove('hidden');
          document.getElementById('nextButton').focus();
        }
      }
    `;
    try {
      const response = await fetch(source, { cache: 'no-store' });
      if (!response.ok) throw new Error(`Lerninhalt konnte nicht geladen werden (${response.status}).`);
      let html = await response.text();
      const closingBody = '</body>';
      if (!html.includes(closingBody)) throw new Error('Das App-Dokument ist unvollständig.');
      html = html.replace(closingBody, '<script>' + improvements + '<\\/script></body>');
      document.open();
      document.write(html);
      document.close();
    } catch (error) {
      document.getElementById('status').outerHTML = '<p class="error" role="alert">ZUNO konnte die App-Datei nicht laden. Bitte prüfe die Internetverbindung und lade die Seite erneut. Deine gespeicherten Fortschritte wurden nicht verändert.</p>';
      console.error(error);
    }
  })();
  </script>
</body>
</html>
