const zunoGermanRotations = {};

function getGermanExample(word) {
  const examples = zunoGermanExamples[String(word.word).toLowerCase()];
  if (!examples || !examples.length) return null;

  const key = String(word.word).toLowerCase();
  const index = zunoGermanRotations[key] || 0;
  zunoGermanRotations[key] = (index + 1) % examples.length;

  return examples[index];
}

function zunoHighlightExample(sentence, highlight) {
  const escaped = escapeHTML(sentence);
  const parts = String(highlight).split(' ... ').map(part =>
    part.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
  );

  let pattern = parts.join('.*?');

  try {
    return escaped.replace(
      new RegExp('(' + pattern + ')', 'i'),
      '<mark>$1</mark>'
    );
  } catch (error) {
    return escaped;
  }
}

      /* ---------------------------------------
         ANTWORTEN PRÜFEN

      function zunoNormalize(value) {
        return String(value || '')
          .toLowerCase()
          .normalize('NFD')
          .replace(/[\\u0300-\\u036f]/g, '')
          .replace(/[’‘]/g, "'")
          .replace(/[^a-z0-9\\s']/g, ' ')
          .replace(/\\s+/g, ' ')
          .trim();
      }

      function zunoEditDistance(a, b) {
        const matrix = Array.from(
          {length: b.length + 1},
          () => []
        );

        for (let i = 0; i <= a.length; i++) matrix[0][i] = i;
        for (let j = 0; j <= b.length; j++) matrix[j][0] = j;

        for (let j = 1; j <= b.length; j++) {
          for (let i = 1; i <= a.length; i++) {
            matrix[j][i] = Math.min(
              matrix[j][i - 1] + 1,
              matrix[j - 1][i] + 1,
              matrix[j - 1][i - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)
            );
          }
        }

        return matrix[b.length][a.length];
      }

      function zunoCloseEnough(submitted, expected) {
        if (!submitted || !expected) return false;
        if (submitted === expected) return true;

        const maxDistance = expected.length >= 8 ? 2 : 1;
        return zunoEditDistance(submitted, expected) <= maxDistance;
      }

      function answerMatches(answer, word) {
        const expected = state.currentMode === 'reverse'
          ? word.word
          : word.translation;

        const submitted = zunoNormalize(answer);

        if (!submitted) return false;

        const accepted = String(expected)
          .split(';')
          .map(zunoNormalize)
          .filter(Boolean);

        if (accepted.some(item => zunoCloseEnough(submitted, item))) {
          return true;
        }

        if (state.currentMode === 'reverse') {
          const alternatives =
            zunoAnswerAlternatives[String(word.word).toLowerCase()] || [];

          if (alternatives.some(item =>
            zunoCloseEnough(submitted, zunoNormalize(item))
          )) {
            return true;
          }
        }

        return false;
      }

        state.answered = false;

        const example = document.getElementById('exampleSentence');
        const mascot = document.getElementById('exerciseMascot');

        mascot.src = 'IMG_2558.png';

        if (mode === 'reverse') {

            ? 'Französisch'

          document.getElementById('modeLabel').textContent =
            'Wie heißt das auf ' + language + '?';

          target.textContent = word.translation;
          example.classList.add('hidden');
          example.textContent = '';
          mascot.src = 'IMG_2560.png';

        } else {
          document.getElementById('modeLabel').textContent =
            mode === 'choice'
              ? 'Wähle die richtige Übersetzung'
              : 'Übersetze das Wort';

          target.textContent = word.word;

          const sentence = getExample(word.word);

          if (sentence) {
            example.innerHTML = highlightWord(sentence, word.word);
            example.classList.remove('hidden');
          } else {
            example.textContent = '';
            example.classList.add('hidden');
          }

          if (mode === 'choice') {
            mascot.src = 'IMG_2560.png';
          }
        }

        renderAnswerArea(word);

        /* Weiß-ich-nicht-Button ergänzen */
        addDontKnowButton(word);

      function addDontKnowButton(word) {
        const answerArea = document.getElementById('answerArea');

        if (!answerArea || state.answered) return;

        if (answerArea.querySelector('#zunoDontKnow')) return;

        const button = document.createElement('button');

        button.id = 'zunoDontKnow';
        button.type = 'button';
        button.textContent = 'Weiß ich nicht';
        button.className = 'secondary-btn';

        button.style.cssText = [
          'display:block',
          'width:100%',
          'margin-top:10px',

          'border:1px solid #e5e2f2',

          'background:#f7f6fc',
          'color:#6252bd',
          'font:inherit',
          'font-weight:600',
          'cursor:pointer'

        button.addEventListener('click', function() {
          if (state.answered) return;

          const currentWord = state.session[state.index];

          /*
            Die aktuelle Vokabel wird hinter zehn weitere
            Vokabeln verschoben. Sind weniger als zehn
            vorhanden, kommt sie ans Ende.
          */
          state.session.splice(state.index + 1, 0, currentWord);

          /*
            Eine leere Antwort löst die normale falsche
            Antwort-Rückmeldung aus. Dadurch wird die
            richtige Lösung angezeigt und der Fortschritt
            wie bei einer falschen Antwort behandelt.
          */
          checkAnswer('', currentWord);
        });

        answerArea.appendChild(button);
      }

      function speakCurrentWord() {
        if (
          !('speechSynthesis' in window) ||
          typeof SpeechSynthesisUtterance === 'undefined'
        ) {
          document.getElementById('feedbackArea').innerHTML =
            '<div class="feedback bad" role="status">Die Sprachausgabe wird von diesem Browser nicht unterstützt.</div>';
          return;
        }

        const word = state.session[state.index];
        if (!word) return;

        const reverse = state.currentMode === 'reverse';

        /*
          Immer nur das sichtbare Wort sprechen.
          Vorwärts: Fremdsprache.
          Rückwärts: Deutsch.
        */
        const text = reverse ? word.translation : word.word;

        const lang = reverse
          ? 'de-DE'
          : (word.language === 'fr' ? 'fr-FR' : 'en-AU');

        try {
          window.speechSynthesis.cancel();

          const utterance = new SpeechSynthesisUtterance(text);

          utterance.lang = lang;
          utterance.rate = 0.88;
          utterance.pitch = 1;

          const selectVoice = () => {
            const prefix = lang.slice(0, 2).toLowerCase();
            const voices = window.speechSynthesis.getVoices();

            let matching = voices.filter(voice =>
              voice.lang &&
              voice.lang.toLowerCase().startsWith(prefix)
            );

            if (prefix === 'en') {
              const australian = matching.find(voice =>
                /en-au|australia/i.test(voice.lang + ' ' + voice.name)
              );

              if (australian) return australian;
            }

            const exact = matching.find(voice =>
              voice.lang.toLowerCase() === lang.toLowerCase()
            );

            return exact || matching[0] || null;
          };

          const voice = selectVoice();

          if (voice) {
            utterance.voice = voice;
          }

          window.speechSynthesis.speak(utterance);

        } catch (error) {
          console.warn('Speech synthesis unavailable', error);
        }
      }

    `;

    try {
      const response = await fetch(source, {cache:"no-store"});

      if (!response.ok) {
        throw new Error("ZUNO source unavailable (" + response.status + ")");
      }

      let page = await response.text();

      if (!page.includes("</body>")) {
        throw new Error("Incomplete ZUNO source");
      }

      page = page.replace(
        "</body>",
        "<script>\n" + patch + "\n<\\/script></body>"
      );

      document.open();
      document.write(page);
      document.close();

    } catch (error) {
      document.getElementById("status").outerHTML =
        '<p class="error" role="alert">ZUNO konnte nicht geladen werden. Bitte prüfe deine Internetverbindung und lade die Seite erneut. Deine gespeicherten Fortschritte bleiben erhalten.</p>';

      console.error(error);
    }
  })();
  </script>
</body>
