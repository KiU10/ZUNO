const zunoGermanRotations = {};

function getGermanExample(word) {
  const key = String(word.word).toLowerCase();
  const examples = zunoGermanExamples[key];
  if (!examples || !examples.length) return null;

  const index = zunoGermanRotations[key] || 0;
  zunoGermanRotations[key] = (index + 1) % examples.length;
  return examples[index];
}

function zunoHighlightExample(sentence, highlight) {
  const escaped = escapeHTML(sentence);
  const parts = String(highlight).split(' ... ').map(part =>
    part.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
  );

  try {
    return escaped.replace(
      new RegExp('(' + parts.join('.*?') + ')', 'i'),
      '<mark>$1</mark>'
    );
  } catch (error) {
    return escaped;
  }
}

/* =========================================
   MULTIPLE-CHOICE-FIX
========================================= */

function zunoNormalize(value) {
  return String(value || '')
    .normalize('NFKC')
    .toLowerCase()
    .trim()
    .replace(/[’‘]/g, "'")
    .replace(/\bsth\b\.?/g, 'something')
    .replace(/\bsb\b\.?/g, 'somebody')
    .replace(/[.,!?;:]+$/g, '')
    .replace(/\s+/g, ' ');
}

function zunoEditDistance(a, b) {
  const matrix = Array.from(
    {length: b.length + 1},
    () => []
  );

  for (let i = 0; i <= a.length; i++) matrix[0][i] = i;
  for (let j = 0; j <= b.length; j++) matrix[j][0] = j;

  for (let j = 1; j <= b.length; j++) {
    for (let i = 1; i <= a.length; i++) {
      matrix[j][i] = Math.min(
        matrix[j][i - 1] + 1,
        matrix[j - 1][i] + 1,
        matrix[j - 1][i - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)
      );
    }
  }

  return matrix[b.length][a.length];
}

function zunoCloseEnough(submitted, expected) {
  if (!submitted || !expected) return false;
  if (submitted === expected) return true;

  const maxDistance = expected.length >= 8 ? 2 : 1;
  return zunoEditDistance(submitted, expected) <= maxDistance;
}

/* Multiple Choice: nur exakte Übersetzungen akzeptieren.
   Dadurch werden richtige Klicks nicht fälschlich abgelehnt. */

window.answerMatches = function(answer, word) {
  const expected = state.currentMode === 'reverse'
    ? word.word
    : word.translation;

  const submitted = zunoNormalize(answer);
  if (!submitted) return false;

  const accepted = String(expected)
    .split(';')
    .map(zunoNormalize)
    .filter(Boolean);

  if (state.currentMode === 'choice') {
    return accepted.includes(submitted);
  }

  if (accepted.some(item => zunoCloseEnough(submitted, item))) {
    return true;
  }

  if (state.currentMode === 'reverse') {
    const alternatives =
      zunoAnswerAlternatives[String(word.word).toLowerCase()] || [];

    if (alternatives.some(item =>
      zunoCloseEnough(submitted, zunoNormalize(item))
    )) return true;
  }

  return false;
};

/* Neue, zuverlässigere Antwortoptionen */

window.makeOptions = function(correctWord) {
  const correct = correctWord.translation;
  const correctNormalized = zunoNormalize(correct);

  const candidates = [];

  if (typeof trickyGroups !== 'undefined') {
    trickyGroups.forEach(group => {
      if (group.some(name =>
        name.toLowerCase() === correctWord.word.toLowerCase()
      )) {
        group.forEach(name => {
          const match = state.session.find(item =>
            item !== correctWord &&
            item.word.toLowerCase() === name.toLowerCase()
          );

          if (match) candidates.push(match.translation);
        });
      }
    });
  }

  const pool = state.session
    .filter(item => item !== correctWord)
    .map(item => item.translation);

  const all = [...candidates, ...shuffle(pool)];
  const unique = [];
  const seen = new Set([correctNormalized]);

  all.forEach(option => {
    const normalized = zunoNormalize(option);
    if (!normalized || seen.has(normalized)) return;
    seen.add(normalized);
    unique.push(option);
  });

  return shuffle([...unique.slice(0, 3), correct]);
};

window.renderQuestion = function() {
  const word = state.session[state.index];
  if (!word) return finishSession();

  state.answered = false;

  document.getElementById('questionCounter').textContent =
    (state.index + 1) + ' / ' + state.session.length;

  document.getElementById('lessonProgress').style.width =
    (state.index / state.session.length * 100) + '%';

  document.getElementById('feedbackArea').innerHTML = '';
  document.getElementById('nextButton').classList.add('hidden');

  const mode = getModes()[state.index % 3];
  state.currentMode = mode;

  const target = document.getElementById('targetWord');
  const example = document.getElementById('exampleSentence');
  const mascot = document.getElementById('exerciseMascot');

  mascot.src = 'IMG_2558.png';

  if (mode === 'reverse') {
    const language = word.language === 'fr'
      ? 'Französisch'
      : 'Englisch';

    document.getElementById('modeLabel').textContent =
      'Wie heißt das auf ' + language + '?';

    target.textContent = word.translation;

    const germanExample = getGermanExample(word);

    if (germanExample) {
      example.innerHTML = zunoHighlightExample(
        germanExample.text,
        germanExample.highlight
      );
      example.classList.remove('hidden');
    } else {
      example.textContent = '';
      example.classList.add('hidden');
    }

    mascot.src = 'IMG_2560.png';

  } else {
    document.getElementById('modeLabel').textContent =
      mode === 'choice'
        ? 'Wähle die richtige Übersetzung'
        : 'Übersetze das Wort';

    target.textContent = word.word;

    const sentence = getExample(word.word);

    if (sentence) {
      example.innerHTML = highlightWord(sentence, word.word);
      example.classList.remove('hidden');
    } else {
      example.textContent = '';
      example.classList.add('hidden');
    }

    if (mode === 'choice') mascot.src = 'IMG_2560.png';
  }

  renderAnswerArea(word);
  addDontKnowButton(word);
};

========================================= */

function addDontKnowButton(word) {
  const answerArea = document.getElementById('answerArea');

  if (!answerArea || state.answered) return;
  if (answerArea.querySelector('#zunoDontKnow')) return;

  const button = document.createElement('button');

  button.id = 'zunoDontKnow';
  button.type = 'button';
  button.textContent = 'Weiß ich nicht';
  button.className = 'secondary-btn';

  button.style.cssText = [
    'display:block',
    'width:100%',
    'margin-top:10px',
    'padding:12px 16px',
    'border:1px solid #e5e2f2',
    'border-radius:12px',
    'background:#f7f6fc',
    'color:#6252bd',
    'font:inherit',
    'font-weight:600',
    'cursor:pointer'
  ].join(';');

  button.addEventListener('click', function() {
    if (state.answered) return;

    const currentWord = state.session[state.index];

    /* Falsch beantwortete Vokabel später erneut abfragen */
    state.session.splice(state.index + 1, 0, currentWord);

    checkAnswer('', currentWord);
  });

  answerArea.appendChild(button);
}


/* =========================================
   SPRACHAUSGABE
========================================= */

window.speakCurrentWord = function() {
  if (
    !('speechSynthesis' in window) ||
    typeof SpeechSynthesisUtterance === 'undefined'
  ) {
    document.getElementById('feedbackArea').innerHTML =
      '<div class="feedback bad" role="status">Die Sprachausgabe wird von diesem Browser nicht unterstützt.</div>';
    return;
  }

  const word = state.session[state.index];
  if (!word) return;

  const reverse = state.currentMode === 'reverse';
  const text = reverse ? word.translation : word.word;

  const lang = reverse
    ? 'de-DE'
    : (word.language === 'fr' ? 'fr-FR' : 'en-AU');

  try {
    window.speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = lang;
    utterance.rate = 0.88;
    utterance.pitch = 1;

    const voices = window.speechSynthesis.getVoices();
    const prefix = lang.slice(0, 2).toLowerCase();

    const matching = voices.filter(voice =>
      voice.lang && voice.lang.toLowerCase().startsWith(prefix)
    );

    let voice = matching.find(item =>
      item.lang.toLowerCase() === lang.toLowerCase()
    );

    if (!voice && prefix === 'en') {
      voice = matching.find(item =>
        /en-au|australia/i.test(item.lang + ' ' + item.name)
      );
    }

    if (voice) utterance.voice = voice;
    window.speechSynthesis.speak(utterance);

  } catch (error) {
    console.warn('Speech synthesis unavailable', error);
  }
};
