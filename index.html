<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7d69e8">
  <title>ZUNO</title>

  <style>
    :root {
      font-family: Inter, "Segoe UI", sans-serif;
      color: #20212a;
      background: #f7f7fa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(440px, 100%);
      background: #fff;
      border: 1px solid #ecebf2;
      border-radius: 22px;
      padding: 26px;
      box-shadow: 0 18px 42px #20212a12;
    }

    .logo {
      color: #6351c7;
      font-weight: 900;
      font-size: 26px;
      letter-spacing: -.08em;
    }

    .muted {
      color: #6d7283;
      line-height: 1.55;
    }

    .error {
      background: #ffeceb;
      color: #9d3b33;
      padding: 14px;
      border-radius: 12px;
      line-height: 1.5;
    }

    .track {
      height: 5px;
      border-radius: 9px;
      background: #eceaf5;
      overflow: hidden;
      margin: 20px 0 12px;
    }

    .track span {
      display: block;
      width: 40%;
      height: 100%;
      background: #7d69e8;
      border-radius: inherit;
      animation: load 1s ease-in-out infinite alternate;
    }

    @keyframes load {
      to {
        transform: translateX(150%);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main aria-live="polite">
    <div class="logo">ZUNO.</div>
    <p id="status">Lerninhalte werden geladen …</p>
    <div class="track" aria-hidden="true"><span></span></div>
    <p class="muted">
      Deine Vokabeln, Beispiele, Fortschritte und Maskottchen bleiben erhalten.
    </p>
  </main>

  <script>
  (async function loadZuno() {
    const oldLoader =
      "https://raw.githubusercontent.com/KiU10/ZUNO/e91adbeb9ffd118ca3eeccee2fc6db094dbb6bad/index.html";

    const source =
      "https://raw.githubusercontent.com/KiU10/ZUNO/3ade70981b096db00dd74d30e5eaf067d50263bc/index.html";

    const moduleBase =
      "https://cdn.jsdelivr.net/gh/KiU10/ZUNO@ZUNO2/";

    const version = "?v=2";

    const status = document.getElementById("status");

    async function fetchText(url) {
      const response = await fetch(url, { cache: "no-store" });

      if (!response.ok) {
        throw new Error(
          "GitHub antwortet mit HTTP " + response.status
        );
      }

      return response.text();
    }

    try {
      status.textContent = "Lade deine bisherigen Lerninhalte ...";

      const previousLoader = await fetchText(oldLoader);

      const startMarker = "const patch = String.raw`";
      const endMarker = "\n    `;\n\n    try {";

      const patchStart = previousLoader.indexOf(startMarker);

      if (patchStart === -1) {
        throw new Error(
          "Der bisherige Vokabel-Patch wurde nicht gefunden."
        );
      }

      const contentStart = patchStart + startMarker.length;
      const patchEnd = previousLoader.indexOf(endMarker, contentStart);

      if (patchEnd === -1) {
        throw new Error(
          "Der Vokabel-Patch konnte nicht vollständig gelesen werden."
        );
      }

      let patch = previousLoader.slice(contentStart, patchEnd);

      // Verhindert, dass ein Script-Endtag den eingefügten Patch beendet.
      patch = patch.replace(/<\/script/gi, "<\\/script");

      status.textContent = "Verbinde mit der ZUNO-App ...";

      let page = await fetchText(source);

      if (
        !page.includes("</body>") ||
        !page.includes("</head>")
      ) {
        throw new Error(
          "Die geladene ZUNO-Datei ist unvollständig."
        );
      }

      const styles =
        '<link rel="stylesheet" href="' +
        moduleBase + "games.css" + version + '">' +
        '<link rel="stylesheet" href="' +
        moduleBase + "animations.css" + version + '">';

      page = page.replace("</head>", styles + "</head>");

      const scripts =
        "<script>\n" +
        patch +
        "\n<\/script>" +

        '<script src="' +
        moduleBase + "progress.js" + version +
        '"><\/script>' +

        '<script src="' +
        moduleBase + "games.js" + version +
        '"><\/script>';

      page = page.replace(
        "</body>",
        scripts + "</body>"
      );

      status.textContent = "ZUNO geladen. Starte App ...";

      document.open();
      document.write(page);
      document.close();

    } catch (error) {
      status.className = "error";

      status.textContent =
        "Fehler beim Laden: " + error.message;

      console.error("ZUNO loading error:", error);
    }
  })();
  </script>
</body>
</html>
